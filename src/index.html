<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <meta content="ie=edge" http-equiv="X-UA-Compatible"/>
        <title>Around The U.S.</title>
    </head>
    <body class="page">
        <div class="page__content">
            <header class="header page__section">
                <img src="<%=require('./images/headerlogo.svg')%>" alt="Around the U.S. logo" class="header__logo">
            </header>
            <main class="content">
                <section class="profile page__section">
                    <img src="<%=require('./images/jacques-cousteau.jpg')%>" alt="avatar" class="profile__image">
                    <button class="profile__avatar-edit-button" id="avatar-edit-button"></button>
                    <div class="profile__info">
                        <h1 class="profile__title">Jacques Cousteau</h1>
                        <button class="profile__edit-button" id="profile-edit-button" type="button"></button>
                        <p class="profile__description">Explorer</p>
                    </div>
                    <button class="profile__add-button" id="add-card-button" type="button"></button>
                </section>
                <section class="cards page__section">
                    <ul class="cards__list"></ul>
                </section>
            </main>
            <footer class="footer page__section">
                <p class="footer__copyright">&copy; 2024 Around the U.S.</p>
            </footer>
        </div>
        <!-- profile edit modal-->
        <div class="modal" id="profile-edit-modal">
            <div class="modal__container">
                <button class="modal__close" id="modal-close-button"></button>
                <h2 class="modal__heading">Edit profile</h2>
                <form class="modal__form">
                    <input
                     type="text" 
                     name="title" 
                     class="modal__input" 
                     id="profile-title-input" 
                     placeholder="Name" 
                     required 
                     minlength="2" 
                     maxlength="40"
                    />
                    <span class="modal__error" id="profile-title-input-error"></span>
                    <input
                     type="text" 
                     name="description" 
                     class="modal__input" 
                     id="profile-description-input" 
                     placeholder="Description" 
                     required 
                     minlength="2" 
                     maxlength="200"
                    />
                    <span class="modal__error" id="profile-description-input-error"></span>
                    <button class="modal__button modal__button_disabled" type="submit">Save</button>
                </form>
            </div>
        </div>
        <!-- add card modal-->
        <div class="modal" id="add-card-modal">
            <div class="modal__container">
                <button class="modal__close" id="modal-close-button"></button>
                <h2 class="modal__heading">New Place</h2>
                <form class="modal__form">
                    <input
                     type="text"
                     name="title" 
                     class="modal__input" 
                     id="card-title-input" 
                     placeholder="Title" 
                     required 
                     minlength="1" 
                     maxlength="30"
                    />
                    <span class="modal__error" id="card-title-input-error"></span>
                    <input
                     type="url" 
                     name="url" 
                     class="modal__input" 
                     id="card-url-input" 
                     placeholder="Image Url"
                     required
                    />
                    <span class="modal__error" id="card-url-input-error"></span>
                    <button class="modal__button modal__button_disabled" type="submit" disabled>Save</button>
                </form>
            </div>
        </div>
        <!-- preview modal -->
        <div class="modal" id="preview-image-modal">
            <div class="modal__preview-container">
              <button class="modal__close" id="preview-modal-close"></button>
              <img class="modal__image" id="modal-image" src="" />
              <div class="modal__title" id="preview-title"></div>
            </div>
          </div>
          
        <template id="card-template">
            <li class="card">
                <img src="" alt="" class="card__image">
                <div class="card__description">
                    <h2 class="card__title"></h2>
                    <button class="card__like-button" type="button"></button>
                    <button class="card__delete-button" type="button"></button>
                </div> 
            </li>
        </template>
        <!--Card Delete Modal-->
        <div class="modal" id="card-delete-modal">
            <div class="modal__container modal__container_delete-card">
                <button class="modal__close" id="delete-modal-close-button"></button>
                <p class="modal__heading modal__heading_delete-card">Are you sure?</p>
                <form class="modal__form" id="delete-card-form">
                    <button class="modal__button">Yes</button>
                </form>
            </div>
        </div>
        <!--Avatar Modal-->
        <div class="modal" id="avatar-modal">
            <div class="modal__container modal__container_avatar-edit">
                <button class="modal__close" id="avatar-modal-close-button"></button>
                <p class="modal__heading">Change Profile Picture</p>
                <form class="modal__form" id="avatar-form">
                    <div class="modal__avatar">
                        <input 
                        class="modal__input modal__input_avatar-edit"
                        type="url"
                        name="avatar"
                        id="avatar-url-input"
                        placeholder="Image Link"
                        required
                        />
                    </div>
                    <span class="modal__error modal__error_avatar-form" id="avatar-url-input-error"></span>
                    <button class="modal__button modal__button_disabled">Save</button>
                </form>
            </div>
        </div>

    </body>
</html>
